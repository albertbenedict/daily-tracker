<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="icon" href="../portfolio/assets/images/favicon.png" />
  <title>Daily Tracker | Todos + Habits</title>
  <meta name="description" content="Minimal daily tracker for todos and habits.">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>

<body>
  <div class="navbar">
    <a class="nav-title" href="./index.html">Daily Tracker</a>
    <div class="nav-right">
      <label class="theme-toggle" for="theme-switch" title="Toggle dark mode">
        <input type="checkbox" id="theme-switch">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>
  </div>

  <main id="main-content">
    <header class="app-header">
      <h1 class="main-title">Todos + Habits</h1>
      <p class="body-text">Add tasks for today, track habits and streaks. Data saved in your browser.</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="todos">Todos</button>
      <button class="tab-btn" data-tab="habits">Habits</button>
    </div>

    <!-- TODOS PANEL -->
    <section id="todos-panel" class="panel active">
      <form id="todo-form" class="input-row">
        <input id="todo-input" type="text" placeholder="Add a task..." maxlength="80" autocomplete="off">
        <input id="todo-duration" class="duration-input" type="number" placeholder="30" min="1" max="999" autocomplete="off">
        <select id="todo-unit" class="unit-select">
          <option value="m">min</option>
          <option value="h">hr</option>
        </select>
        <input id="todo-date" type="date" style="border:2px solid var(--border-color); border-radius:50px; padding:10px; background:var(--bg-color); color:var(--text-color); flex:0 0 140px;">
        <button type="submit" class="button"><span class="button-text">Add</span></button>
      </form>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Done</button>
        <span id="todo-stats" class="stats"></span>
      </div>
      <ul id="todo-list" class="item-list"></ul>
      <p id="todo-empty" class="empty-text">No tasks yet. Add one above.</p>
      <button id="clear-completed" class="icon-btn" style="align-self:flex-end; font-size:13px; opacity:0.7;">Clear
        done</button>
    </section>

    <!-- HABITS PANEL -->
    <section id="habits-panel" class="panel">
      <form id="habit-form" class="input-row">
        <input id="habit-input" type="text" placeholder="Add a habit..." maxlength="40"
          autocomplete="off">
        <input id="habit-duration" class="duration-input" type="number" placeholder="Duration (Optional)" min="1" max="999"
          autocomplete="off">
        <select id="habit-unit" class="unit-select">
          <option value="m">min</option>
          <option value="h">hr</option>
        </select>
        <button type="submit" class="button"><span class="button-text">Add</span></button>
      </form>
      <p class="hint">Check off once per day. Streak increases when you hit consecutive days.</p>
      <ul id="habit-list" class="item-list"></ul>
      <p id="habit-empty" class="empty-text">No habits yet. Add one to start your streak.</p>
    </section>
  </main>

  <footer id="footer">
    <span class="footer-copyright">Daily Tracker</span>
  </footer>
</body>

</html>
